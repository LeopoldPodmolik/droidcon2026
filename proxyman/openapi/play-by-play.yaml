openapi: 3.0.3
info:
  title: NBA GameDay API — Play-by-Play
  version: 2.0.0

paths:
  /api/v2/nba/games/{gameId}/play-by-play:
    get:
      summary: Get play-by-play data for a game
      operationId: getPlayByPlay
      tags:
        - Play-by-Play
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            example: "g-0022500987"
        - name: period
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 6
        - name: startClock
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{2}:\d{2}$'
      responses:
        '200':
          description: Play-by-play data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      gameId:
                        type: string
                      period:
                        type: integer
                      plays:
                        type: array
                        items:
                          $ref: '#/components/schemas/Play'

components:
  schemas:
    Play:
      type: object
      properties:
        playId:
          type: string
        clock:
          type: string
        period:
          type: integer
        teamId:
          type: string
          nullable: true
        playType:
          type: string
          enum:
            - MADE_SHOT
            - MISSED_SHOT
            - MADE_THREE
            - MISSED_THREE
            - FREE_THROW
            - REBOUND
            - ASSIST
            - TURNOVER
            - STEAL
            - BLOCK
            - FOUL
            - TIMEOUT
            - JUMP_BALL
            - SUBSTITUTION
        description:
          type: string
        player:
          $ref: '#/components/schemas/PlayerRef'
          nullable: true
        assistPlayer:
          $ref: '#/components/schemas/PlayerRef'
          nullable: true
        scoreHome:
          type: integer
        scoreAway:
          type: integer
        coordinates:
          type: object
          nullable: true
          properties:
            x:
              type: number
            y:
              type: number

    PlayerRef:
      type: object
      properties:
        playerId:
          type: string
        name:
          type: string
